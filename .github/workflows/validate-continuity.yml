name: Validate conversation continuity

on:
  push:
    branches:
      - fix-conversation-continuity

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx vitest run tests/registry.test.ts tests/antigravity-catalog.test.ts tests/antigravity-gateway.test.ts
      - run: npm run typecheck
      - run: npm run build
